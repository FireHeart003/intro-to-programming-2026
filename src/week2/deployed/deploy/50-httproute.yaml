# No `hostnames:` — the route pins to the `parking-lot` listener and inherits
# parking-lot.hypertheory-labs.dev from it (see public-access.md). That listener
# and its certificate live in homelab-impl, not here.
#
# A wrong sectionName binds to nothing, silently. After applying, check:
#   kubectl get gateway traefik-gateway -n traefik \
#     -o jsonpath='{range .status.listeners[*]}{.name}: attached={.attachedRoutes}{"\n"}{end}'
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: parking-lot
  namespace: intro-sep-2026
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: parking-lot
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: gateway
          port: 80
