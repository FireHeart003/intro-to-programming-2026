# Angular SPA served by nginx. Not exposed directly — the Gateway proxies to it.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: intro-sep-2026
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      imagePullSecrets:
        - name: gitea-registry
      containers:
        - name: frontend
          image: git.hypertheory-labs.dev/jeffry/parking-lot-frontend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: intro-sep-2026
spec:
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: http
